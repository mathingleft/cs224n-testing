model:
  name: "Qwen/Qwen2.5-0.5B-Instruct"
  load_in_4bit: false

generation:
  num_samples: 8
  temperature: 0.7
  top_p: 0.95
  max_new_tokens: 1024
  batch_size: 4

training:
  method: "sft"
  lora:
    r: 16
    alpha: 32
    target_modules: ["q_proj", "v_proj", "k_proj", "o_proj"]
    dropout: 0.05
  epochs: 2
  lr: 2e-5
  warmup_ratio: 0.05
  max_seq_len: 1024
  gradient_accumulation_steps: 4

distillation:
  rounds: 3
  min_correct_ratio: 0.0
  max_correct_ratio: 0.95

evaluation:
  pass_at_k: [1, 8]
  eval_split: "test"
